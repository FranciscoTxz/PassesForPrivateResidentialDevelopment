[project]
name = "passesforprivateresidentialdevelopment"
version = "0.1.0"
description = "A Python package for managing passes for private residential development."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.1",
    "mongoengine>=0.29.3",
    "pydantic[email]>=2.12.5",
    "pyjwt>=2.12.1",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-env>=1.5.0",
    "python-dotenv>=1.2.2",
    "ruff>=0.15.5",
    "testcontainers>=4.14.1",
    "mypy>=1.19.1",
]

[tool.mypy]
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["mongoengine", "mongoengine.*"]
ignore_missing_imports = true
follow_untyped_imports = true

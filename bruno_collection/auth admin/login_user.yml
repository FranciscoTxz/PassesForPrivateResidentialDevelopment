info:
  name: login_user
  type: http
  seq: 2

http:
  method: POST
  url: "{{URL}}/auth/sign-in"
  body:
    type: json
    data: |-
      {
        "email": "admin@example.com",
        "password": "Password123!"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        var jsonData = res.getBody();
        bru.setEnvVar("TOKEN_ADMIN", jsonData.access_token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: get token gatehouse (admin)
  type: http
  seq: 1

http:
  method: POST
  url: "{{URL}}/gatehouse/token"
  headers:
    - name: Authorization
      value: "{{TOKEN_ADMIN}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        var jsonData = res.getBody();
        bru.setEnvVar("GATEHOUSE_TOKEN", jsonData.gatehouse_token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

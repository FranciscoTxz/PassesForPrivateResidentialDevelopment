info:
  name: get pages users
  type: http
  seq: 1

http:
  method: GET
  url: "{{URL}}/users/pages"
  headers:
    - name: Authorization
      value: "{{TOKEN_ADMIN}}"
  params:
    - name: page_size
      value: "2"
      type: query
      disabled: true
    - name: query
      value: antonio
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

info:
  name: create simple pass
  type: http
  seq: 1

http:
  method: POST
  url: "{{URL}}/passes"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "pass_type": "temporary",
        "guest_name": "Angel Torres",
        "valid_from": "2026-03-30T12:25:00.000-06:00"
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        var jsonData = res.getBody();
        bru.setEnvVar("PASS_ID", jsonData.pass._id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

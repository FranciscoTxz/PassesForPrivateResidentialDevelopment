info:
  name: get pass (admin)
  type: http
  seq: 6

http:
  method: GET
  url: "{{URL}}/passes/search?pass_id={{PASS_ID}}"
  headers:
    - name: Authorization
      value: "{{TOKEN_ADMIN}}"
  params:
    - name: pass_id
      value: "{{PASS_ID}}"
      type: query

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

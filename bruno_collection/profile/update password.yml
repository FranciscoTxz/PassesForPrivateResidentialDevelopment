info:
  name: update password
  type: http
  seq: 3

http:
  method: PUT
  url: "{{URL}}/profile/password"
  headers:
    - name: Authorization
      value: "{{TOKEN}}"
  body:
    type: json
    data: |-
      {
        "old_password": "Password123!",
        "new_password": "Password123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

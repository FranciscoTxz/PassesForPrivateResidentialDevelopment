info:
  name: search house
  type: http
  seq: 3

http:
  method: GET
  url: "{{URL}}/houses?address=Av&limit=2"
  headers:
    - name: Authorization
      value: "{{TOKEN_ADMIN}}"
  params:
    - name: address
      value: Av
      type: query
    - name: limit
      value: "2"
      type: query
    - name: next_cursor
      value: SV104
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
